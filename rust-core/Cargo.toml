[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
arrow = "57.0.0"
arrow-array = "57.0.0"
arrow-csv = "57.0.0"
arrow-ipc = "57.0.0"
arrow-ord = "57.0.0"
arrow-schema = "57.0.0"
arrow-select = "57.0.0"
js-sys = "0.3.82"
once_cell = "1.21.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
